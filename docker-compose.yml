services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brick_inventory
      POSTGRES_USER: brick_inventory
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brick_inventory -d brick_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_KEY: base64:dGhpc2lzYWR1bW15a2V5Zm9ybG9jYWxkZXZlbG9wbWU=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      SANCTUM_STATEFUL_DOMAINS: "localhost,localhost:5173,localhost:8000,127.0.0.1"
      SESSION_DOMAIN: localhost
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: brick_inventory
      DB_USERNAME: brick_inventory
      DB_PASSWORD: secret
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api

volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules:

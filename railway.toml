# Railway deploy config for the monorepo.
#
# Set the Railway service's Root Directory to `/` (the orchestrator root)
# so the Dockerfile at this level builds the multi-stage image with the
# frontend baked into backend/public/. The Cloudflare Pages deploy is
# dropped in this layout — one Railway service serves both surfaces.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Keep the deploy chain minimal: migrate forward and start Octane. config:cache
# and view:cache are perf optimizations, not correctness — and view:cache in
# particular was failing silently in this API-only project (no Blade views to
# compile), breaking the chain before octane:start could bind to PORT. If we
# want config:cache later, add it via a separate `ARG`-driven build step in
# the Dockerfile instead of the runtime chain. route:cache stays off because
# routes/web.php uses a closure for the SPA fallback that can't be serialized.
startCommand = "echo '=== START ==='; pwd; ls /var/www/html | head; echo '=== running migrate ==='; php artisan migrate --force; echo \"=== migrate done, exit=$? ===\"; echo '=== running frankenphp version ==='; /usr/local/bin/frankenphp version; echo \"=== version done, exit=$? ===\"; echo '=== sleeping 600 to keep container alive ==='; sleep 600"
# Temporarily disabled — Railway was killing the container after the
# healthcheck window before any output landed. Without a path here,
# Railway falls back to a TCP-only liveness check, so the container
# survives long enough to log whatever frankenphp/octane is actually
# doing. Restore "/api/health" once we have a working deploy.
# healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 1

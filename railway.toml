# Railway deploy config for the monorepo.
#
# Set each Railway service's Root Directory to `/` (the orchestrator
# root) so this file applies and the Dockerfile at this level builds
# the multi-stage image with the frontend baked into backend/public/.
# The Cloudflare Pages deploy is dropped — one Railway service serves
# both surfaces; a second service runs the queue worker against the
# same image.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Both services share this image; they differ only in the QUEUE_WORKER
# env var. backend/bin/start.sh branches on it: unset → web (migrate +
# octane:start); set → queue worker (php artisan queue:work). The
# script is in version control rather than a per-service startCommand
# because Railway locks values defined in railway.toml (dashboard
# fields go read-only) and there is no per-service override syntax in
# a single file.
#
# The `bash` wrap is required: Railway exec()s startCommand directly
# without a shell, so any `&&`/`;` in the string would silently drop
# everything after the first command (this was the root cause of the
# 2026-05-17 deploy-failure session — PRs #44 through #53).
#
# healthcheckPath and healthcheckTimeout are *deliberately not set
# here* — defining them locks the dashboard for both services, and the
# queue worker has no HTTP listener to ping. The web service's
# healthcheck is configured in the dashboard at `/api/health` with a
# 120s timeout.
startCommand = "bash bin/start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

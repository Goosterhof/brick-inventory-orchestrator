version: 2

updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - backend
    groups:
      laravel:
        patterns:
          - "laravel/*"
      dev-tooling:
        patterns:
          - "pestphp/*"
          - "phpstan/*"
          - "rector/*"
          - "larastan/*"
          - "deptrac/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend
    groups:
      fs-packages:
        patterns:
          - "@script-development/fs-*"
    ignore:
      # @types/node major tracks the Node runtime major (24, setup-node + engines);
      # a higher major types APIs the runtime does not have.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Same rule as /frontend: e2e runs on setup-node 24 in e2e.yml.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - ci

version: 2

updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - backend
    groups:
      laravel:
        patterns:
          - "laravel/*"
      dev-tooling:
        patterns:
          - "pestphp/*"
          - "phpstan/*"
          - "rector/*"
          - "larastan/*"
          - "deptrac/*"
          - "captainhook/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend
    groups:
      fs-packages:
        patterns:
          - "@script-development/fs-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - ci

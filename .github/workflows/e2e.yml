name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'docker-compose*.yml'
      - 'docker/**'
      - 'Dockerfile'
      - 'railway.toml'
      - '.dockerignore'
      - 'Makefile'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'docker-compose*.yml'
      - 'docker/**'
      - 'Dockerfile'
      - 'railway.toml'
      - '.dockerignore'
      - 'Makefile'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/gate.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps

      - name: Type-check E2E code
        run: |
          cd e2e
          npm run type-check

      - name: Lint E2E code
        run: |
          cd e2e
          npm run lint

      - name: Format-check E2E code
        run: |
          cd e2e
          npm run format:check

      - name: Start services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: Wait for services
        run: |
          echo "Waiting for backend..."
          timeout 120 bash -c 'until curl -sf http://localhost:8000/api/health; do sleep 2; done'
          echo "Waiting for frontend..."
          timeout 60 bash -c 'until curl -sf http://localhost:5173; do sleep 2; done'
          echo "Services ready!"

      - name: Run migrations
        run: |
          docker compose exec -T backend php artisan migrate --force

      - name: Seed reference data
        # The four seeders are loadbearing for distinct test surfaces:
        #   * SetSeeder        — family-set CRUD tests (POST family-sets short-
        #                        circuits the Rebrickable lookup when the set
        #                        already exists locally)
        #   * ColorSeeder      — colors referenced by SetPart rows
        #   * PartSeeder       — parts referenced by SetPart rows
        #   * SetPartSeeder    — wires Boutique Hotel (10297-1) to 5 parts; the
        #                        parts-management + place-part specs need a
        #                        family-set with an actual parts list to drive
        #                        the missing/unsorted endpoints
        run: |
          docker compose exec -T backend php artisan db:seed --class=ColorSeeder --force
          docker compose exec -T backend php artisan db:seed --class=PartSeeder --force
          docker compose exec -T backend php artisan db:seed --class=SetSeeder --force
          docker compose exec -T backend php artisan db:seed --class=SetPartSeeder --force

      - name: Run E2E tests
        run: |
          cd e2e
          npx playwright test
        env:
          CI: true

      - name: Show container logs
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs

      - name: Dump Laravel application log
        if: failure()
        run: |
          # Octane / artisan-serve does not surface application exceptions on stdout, only
          # writes them to storage/logs/laravel.log. Surface that file so the family-set
          # POST-500 root cause is no longer invisible in failure runs.
          docker compose exec -T backend sh -c 'test -f storage/logs/laravel.log && tail -n 300 storage/logs/laravel.log || echo "(no laravel.log yet)"'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-traces
          path: e2e/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

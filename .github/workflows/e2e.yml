name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps

      - name: Type-check E2E code
        run: |
          cd e2e
          npm run type-check

      - name: Lint E2E code
        run: |
          cd e2e
          npm run lint

      - name: Format-check E2E code
        run: |
          cd e2e
          npm run format:check

      - name: Start services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: Wait for services
        run: |
          echo "Waiting for backend..."
          timeout 120 bash -c 'until curl -sf http://localhost:8000/api/health; do sleep 2; done'
          echo "Waiting for frontend..."
          timeout 60 bash -c 'until curl -sf http://localhost:5173; do sleep 2; done'
          echo "Services ready!"

      - name: Run migrations
        run: |
          docker compose exec -T backend php artisan migrate --force

      - name: Seed reference data
        # Family-set tests POST set_num "75192-1" (Millennium Falcon) and rely on
        # the set existing in the local DB so CreateFamilySetAction skips the
        # Rebrickable lookup. The set lives in SetSeeder.
        run: |
          docker compose exec -T backend php artisan db:seed --class=SetSeeder --force

      - name: Run E2E tests
        run: |
          cd e2e
          npx playwright test
        env:
          CI: true

      - name: Show container logs
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs

      - name: Dump Laravel application log
        if: failure()
        run: |
          # Octane / artisan-serve does not surface application exceptions on stdout, only
          # writes them to storage/logs/laravel.log. Surface that file so the family-set
          # POST-500 root cause is no longer invisible in failure runs.
          docker compose exec -T backend sh -c 'test -f storage/logs/laravel.log && tail -n 300 storage/logs/laravel.log || echo "(no laravel.log yet)"'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-traces
          path: e2e/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'docker/backend.Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.e2e.yml'
      - 'Makefile'
      - '.env.example'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'docker/backend.Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.e2e.yml'
      - 'Makefile'
      - '.env.example'
      - 'scripts/**'

defaults:
  run:
    working-directory: backend

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, json, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check for known vulnerabilities
        run: composer audit

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, json, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Each tool keeps its cache in-tree (rector.php, pint.json, phpstan.neon). Every key hashes
      # the tool's config and composer.lock and falls back only to that same hash, so a config or
      # version change starts cold. Restore and save are split: a combined actions/cache step saves
      # only on success, and a dry-run with findings exits non-zero. `continue-on-error`: an
      # unreachable cache service costs a cold run, never a red lane.
      #
      # Rector's cache is not exact: it skips a file whose own hash is unchanged, so a change in
      # file B that makes a rule fire on untouched file A passes on a warm run. So only a push to
      # main saves it, cold over the whole tree, and a pull request only restores it; the merge's
      # own push run catches an untouched dependent.
      - name: Restore Rector cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: backend/storage/rector
          key: rector-${{ hashFiles('backend/rector.php', 'backend/composer.lock') }}-${{ github.sha }}
          restore-keys: |
            rector-${{ hashFiles('backend/rector.php', 'backend/composer.lock') }}-

      - name: Run Rector
        id: rector
        run: composer rector:test

      - name: Save Rector cache
        if: always() && github.event_name == 'push' && steps.rector.outcome != 'skipped'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: backend/storage/rector
          key: rector-${{ hashFiles('backend/rector.php', 'backend/composer.lock') }}-${{ github.sha }}

      - name: Restore Pint cache
        id: pint-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: backend/storage/pint.cache
          key: pint-${{ hashFiles('backend/pint.json', 'backend/composer.lock') }}-${{ github.sha }}
          restore-keys: |
            pint-${{ hashFiles('backend/pint.json', 'backend/composer.lock') }}-

      - name: Run Pint
        id: pint
        run: composer pint:test

      - name: Save Pint cache
        if: always() && steps.pint.outcome != 'skipped' && steps.pint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: backend/storage/pint.cache
          key: pint-${{ hashFiles('backend/pint.json', 'backend/composer.lock') }}-${{ github.sha }}

      # PHPStan validates its own result cache (file hashes, dependents, config and version), so a
      # warm run re-analyses what changed.
      - name: Restore PHPStan result cache
        id: phpstan-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: backend/storage/phpstan
          key: phpstan-${{ hashFiles('backend/phpstan.neon', 'backend/composer.lock') }}-${{ github.sha }}
          restore-keys: |
            phpstan-${{ hashFiles('backend/phpstan.neon', 'backend/composer.lock') }}-

      - name: Run PHPStan
        id: phpstan
        run: composer phpstan

      - name: Save PHPStan result cache
        if: always() && steps.phpstan.outcome != 'skipped' && steps.phpstan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: backend/storage/phpstan
          key: phpstan-${{ hashFiles('backend/phpstan.neon', 'backend/composer.lock') }}-${{ github.sha }}

      - name: Run Deptrac
        run: composer deptrac

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Run architecture tests
        run: composer test:arch

      - name: Run tests
        run: composer test

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_sqlite
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Run unit tests with 100% coverage requirement
        run: composer test:coverage

  feature-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_sqlite
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Run feature tests with 90% coverage requirement
        run: composer test:feature-coverage

  mutation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_sqlite
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Run mutation testing
        run: composer mutation

  sast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/php
            p/laravel
            p/owasp-top-ten
            p/security-audit

  seed:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run seeders
        run: php artisan db:seed --force

name: Frontend CI

on:
    push:
        branches: [main]
        paths:
            - 'frontend/**'
            - '.github/workflows/frontend-ci.yml'
            - 'docker/frontend.Dockerfile'
            - 'docker-compose.yml'
            - 'docker-compose.e2e.yml'
            - 'Makefile'
            - '.env.example'
            - 'scripts/**'
    pull_request:
        branches: [main]
        paths:
            - 'frontend/**'
            - '.github/workflows/frontend-ci.yml'
            - 'docker/frontend.Dockerfile'
            - 'docker-compose.yml'
            - 'docker-compose.e2e.yml'
            - 'Makefile'
            - '.env.example'
            - 'scripts/**'

defaults:
    run:
        working-directory: frontend

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint (oxlint)
              run: npm run lint

            - name: Lint Vue conventions
              run: npm run lint:vue

            - name: Check unused exports (knip)
              run: npm run knip

            - name: Format check (oxfmt)
              run: npm run format:check

            - name: Type check
              run: npm run type-check

            - name: Test with coverage
              run: npm run test:coverage

            - name: Build
              run: npm run build

            - name: Check bundle size
              run: npm run size

            - name: Lint commit messages
              # Skipped on the one-time monorepo-migration branch. The PR's
              # range against main spans 1500+ commits absorbed via
              # `git subtree add` from the former standalone repos, and many
              # of those historical messages predate the current commitlint
              # config. commitlint v20's underlying git-raw-commits@5 silently
              # ignores `--git-log-args`, so there is no in-tool way to scope
              # the range to first-parent. Once this PR merges, future PRs'
              # `pull_request.base.sha..HEAD` will only span their own commits
              # and the gate works normally — this skip is intentionally
              # scoped to the migration branch name and needs no follow-up.
              if: github.event_name == 'pull_request' && github.head_ref != 'chore/monorepo-migration'
              run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD --verbose

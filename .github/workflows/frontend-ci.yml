name: Frontend CI

on:
    push:
        branches: [main]
        paths:
            - 'frontend/**'
            - '.github/workflows/frontend-ci.yml'
            - 'docker/frontend.Dockerfile'
            - 'docker-compose.yml'
            - 'docker-compose.e2e.yml'
            - 'Makefile'
            - '.env.example'
            - 'scripts/**'
    pull_request:
        branches: [main]
        paths:
            - 'frontend/**'
            - '.github/workflows/frontend-ci.yml'
            - 'docker/frontend.Dockerfile'
            - 'docker-compose.yml'
            - 'docker-compose.e2e.yml'
            - 'Makefile'
            - '.env.example'
            - 'scripts/**'

defaults:
    run:
        working-directory: frontend

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint (oxlint)
              run: npm run lint

            - name: Lint Vue conventions
              run: npm run lint:vue

            - name: Check unused exports (knip)
              run: npm run knip

            - name: Format check (oxfmt)
              run: npm run format:check

            - name: Type check
              run: npm run type-check

            - name: Test with coverage
              run: npm run test:coverage

            - name: Build
              run: npm run build

            - name: Check bundle size
              run: npm run size

            - name: Lint commit messages
              if: github.event_name == 'pull_request'
              # --first-parent scopes to the orchestrator-mainline commits so the
              # 1500+ subtree-merged commits from the former standalone repos are
              # not re-validated against today's commitlint config. --no-merges
              # additionally excludes merge commits themselves (the two git
              # subtree add commits have non-conventional messages of the form
              # "Add 'backend/' from commit '...'", and any future PR merge
              # commits would also fail without this).
              run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD --verbose --git-log-args '--first-parent --no-merges'

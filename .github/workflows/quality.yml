name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    name: Brick Quality Control
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build backend container
        run: docker compose build backend

      - name: Start backend
        run: docker compose up -d backend
        env:
          APP_ENV: testing

      - name: Wait for backend
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8000/api/health; do sleep 2; done'

      - name: Run migrations
        run: docker compose exec -T backend php artisan migrate --force

      - name: Run backend tests
        run: docker compose exec -T backend composer test

      - name: Run backend lint
        run: docker compose exec -T backend composer lint

      - name: Show container logs
        if: failure()
        run: docker compose logs backend postgres

  frontend-quality:
    name: Plate Clutch Power
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build frontend container
        run: docker compose build frontend

      - name: Start frontend
        run: docker compose up -d frontend

      - name: Run frontend type-check
        run: docker compose exec -T frontend npm run type-check

      - name: Run frontend tests
        run: docker compose exec -T frontend npm run test:unit

      - name: Run frontend lint
        run: docker compose exec -T frontend npm run lint

      - name: Run frontend build
        run: docker compose exec -T frontend npm run build

      - name: Check bundle sizes
        run: docker compose exec -T frontend npm run size

      - name: Show container logs
        if: failure()
        run: docker compose logs frontend
